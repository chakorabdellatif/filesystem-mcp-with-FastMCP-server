model_list:
  # Local SLMs (Offline & Ultra-Fast)
  - model_name: local-coder
    litellm_params:
      model: ollama/qwen2.5-coder:1.5b
      api_base: http://localhost:11434

  - model_name: local-fast
    litellm_params:
      model: ollama/llama3.2:1b
      api_base: http://localhost:11434

  # Google AI Studio (Free Tier)
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash-exp
      api_key: os.environ/GEMINI_API_KEY

  # Groq Cloud (Free Tier - 300+ tokens/sec)
  - model_name: groq-llama-70b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  - model_name: groq-mixtral
    litellm_params:
      model: groq/mixtral-8x7b-32768
      api_key: os.environ/GROQ_API_KEY

  # Cerebras Ultra-Fast Inference (Free Tier)
  - model_name: cerebras-llama-70b
    litellm_params:
      model: cerebras/llama3.1-70b
      api_key: os.environ/CEREBRAS_API_KEY

  # SambaNova Systems (Free Tier)
  - model_name: sambanova-llama-405b
    litellm_params:
      model: sambanova/Meta-Llama-3.1-405B-Instruct
      api_key: os.environ/SAMBANOVA_API_KEY

  # HuggingFace Serverless Inference (Free Tier)
  - model_name: hf-qwen-coder
    litellm_params:
      model: huggingface/Qwen/Qwen2.5-Coder-32B-Instruct
      api_key: os.environ/HUGGINGFACE_API_KEY

  # OpenRouter Free Tier Models (:free)
  - model_name: openrouter-deepseek-r1-free
    litellm_params:
      model: openrouter/deepseek/deepseek-r1:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-gemini-free
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-exp:free
      api_key: os.environ/OPENROUTER_API_KEY

  # Commercial Standard Gateways
  - model_name: gpt-4o-mini
    litellm_params:
      model: gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

router_settings:
  routing_strategy: latency-based-routing
  fallbacks:
    - local-coder: [groq-llama-70b, gemini-flash, hf-qwen-coder]
    - local-fast: [groq-llama-70b, gemini-flash]
    - groq-llama-70b: [cerebras-llama-70b, sambanova-llama-405b, gemini-flash]
    - gpt-4o-mini: [gemini-flash, groq-llama-70b, local-coder]

general_settings:
  master_key: sk-omniroute-master-key
  database_url: sqlite:///litellm_spend.db
